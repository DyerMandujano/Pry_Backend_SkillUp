# ===================================================================
# PUERTO DEL SERVIDOR (Soporta variable de entorno PORT en la nube)
# ===================================================================
server.port=${PORT:8888}

# ===================================================================
# SEGURIDAD DE TRANSPORTE HTTPS / TLS (OWASP ASVS V9)
# ===================================================================
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:skillup2026}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=skillup-local
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# ===================================================================
# CONEXIÓN A AZURE SQL DATABASE
# (Valores por defecto apuntando a Azure, sobreescribibles por variables de entorno)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://skillup.database.windows.net:1433;databaseName=Skillup;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${DB_USERNAME:Admin@skillup.pe@skillup}
spring.datasource.password=${DB_PASSWORD:Skillup123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===================================================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===================================================================
# PERMITIR SUBIDA DE ARCHIVOS GRANDES (Hasta 50MB)
# ===================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
